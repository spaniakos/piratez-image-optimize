name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - run: python3 tools/build_release.py
